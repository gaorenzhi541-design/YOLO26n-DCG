# YOLO26n-DCG Configuration for Dorsal Hand Acupoint Detection

# Parameters
nc: 1 # Number of classes (dorsal hand)
end2end: True
reg_max: 1
kpt_shape: [15, 3] # 15 dorsal hand acupoints (x, y, visibility)
scales:
  n: [0.33, 0.25, 1024]

# YOLO26 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, D_LKA, []] # 9 Deformable Large Kernel Attention (D-LKA)
  - [-1, 1, SPPF, [1024, 5]] # 10

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5 (connected to SPPF)
  - [-1, 2, C2fCIB, [1024, True, False]] # 22 Compact Inverted Block (P5/32-large)

  - [[16, 19, 22], 1, Pose26, [nc, kpt_shape]] # 23 Output Pose Head
